services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: innercircle
      POSTGRES_PASSWORD: innercircle
      POSTGRES_DB: innercircle
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: innercircle
      MINIO_ROOT_PASSWORD: innercircle-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
